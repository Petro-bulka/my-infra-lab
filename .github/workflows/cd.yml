name: CD

on:
  push:
    branches: [ main ]
    paths:
      - 'html/**'
      - 'nginx.conf'
      - 'Dockerfile'
      - 'helm/**'
      - '.github/workflows/cd.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}:${{ github.sha }}

      - name: Update image tag in values.yaml
        run: |
          cd helm/my-infra-lab
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" values.yaml
          cd ../..
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/my-infra-lab/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes"
          git push

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: my-infra-lab
data:
  nginx.conf: |
    events {}

    http {
        server {
            listen 80;
            server_name _;

            location / {
                root  /usr/share/nginx/html;
                index index.html;
            }
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>My Infra Lab — K8s</title>
    </head>
    <body>
    <h1>Привет из Kubernetes!</h1>
    <p>Этот сайт работает в K8s-кластере.</p>
    </body>
    </html>

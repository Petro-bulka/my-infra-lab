# Количество реплик Nginx
replicaCount: 2

# Nginx
nginx:
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80

# Ingress
ingress:
  enabled: true
  className: traefik
  host: my-infra-lab.local
  path: /

# PostgreSQL
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
  auth:
    username: admin
    password: secretpassword
    database: mydb
  persistence:
    size: 2Gi

# ConfigMap для Nginx
config:
  indexHtml: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>My Infra Lab — Helm</title>
    </head>
    <body>
    <h1>Привет из Kubernetes с Helm!</h1>
    <p>Этот сайт развёрнут через Helm-чарт.</p>
    </body>
    </html>
